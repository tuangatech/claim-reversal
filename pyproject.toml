[project]
name = "claim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "crewai",
    "crewai[a2a]",
    "mcp",
    "openai",
    "httpx",
    "pydantic",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
]

[project.optional-dependencies]
playwright = [
    "playwright",
    "pdfplumber",
]